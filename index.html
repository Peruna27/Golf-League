<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Major League 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: #0d1117;
            color: #f4f1e8;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 103, 71, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(10, 36, 81, 0.18) 0%, transparent 50%);
            z-index: -1;
        }

        .wrap {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-style: italic;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 0.5px;
            color: #d4b963;
            margin-bottom: 6px;
        }

        .subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8a9aa3;
            margin-bottom: 36px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: block;
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 22px 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent, #c8a951);
        }

        .card:active {
            transform: scale(0.985);
        }

        .card.masters { --accent: #006747; }
        .card.pga     { --accent: #0a2451; }

        .card.masters:hover { border-color: rgba(0, 103, 71, 0.5); }
        .card.pga:hover     { border-color: rgba(10, 36, 81, 0.6); }

        .card-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-logo {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 10px;
            padding: 4px;
        }

        .card-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-text {
            flex: 1;
            text-align: left;
        }

        .card-name {
            font-family: 'Source Serif 4', Georgia, serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.3px;
        }

        .card-detail {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: #8a9aa3;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        .card-status {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .status-live    { background: rgba(231, 76, 60, 0.18); color: #f08070; }
        .status-upcoming{ background: rgba(212, 175, 55, 0.18); color: #d4b963; }
        .status-done    { background: rgba(255,255,255,0.06); color: #6b7a85; }

        .footer {
            margin-top: 40px;
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: #5a6770;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="title">Major League</div>
        <div class="subtitle">2026 Fantasy Season</div>

        <div class="cards">
            <a class="card masters" href="2026_Masters/">
                <div class="card-row">
                    <div class="card-logo">
                        <img src="https://images.seeklogo.com/logo-png/28/1/masters-golf-tournament-logo-png_seeklogo-289048.png" alt="Masters">
                    </div>
                    <div class="card-text">
                        <div class="card-name">The Masters</div>
                        <div class="card-detail">Augusta National &middot; Apr 9–12</div>
                    </div>
                    <div class="card-status status-done">Final</div>
                </div>
            </a>

            <a class="card pga" href="2026_PGA_Championship/">
                <div class="card-row">
                    <div class="card-logo">
                        <img src="https://golf-brightspot.s3.us-east-1.amazonaws.com/pga/20/91/b7c6d0fa4e189a63357f4c84ad94/pga-trophy-championship-rgb-1.png" alt="PGA Championship">
                    </div>
                    <div class="card-text">
                        <div class="card-name">PGA Championship</div>
                        <div class="card-detail">Aronimink &middot; May 14–17</div>
                    </div>
                    <div class="card-status status-upcoming">Up Next</div>
                </div>
            </a>
        </div>

        <div class="footer">Tap a tournament to view leaderboard</div>
    </div>
</body>
</html>
